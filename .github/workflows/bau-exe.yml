name: Build bau.exe

on:
  push:
    branches: [main]
    paths:
      - 'bau/bau.py'
      - 'bau/app.html'
      - 'assets/style.css'
      - '.github/workflows/bau-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Check the script loads
        run: python -c "import ast,sys; ast.parse(open('bau/bau.py',encoding='utf-8').read())"

      - name: Smoke test without a console (like the .exe)
        shell: bash
        run: |
          cp assets/style.css bau/style.css
          cat > smoke.py <<'PY'
          import sys, os, threading, time, urllib.request
          sys.stdout = None; sys.stderr = None
          sys.path.insert(0, 'bau')
          import webbrowser; webbrowser.open = lambda *a, **k: True
          import bau
          bau.PORT = 7399
          threading.Thread(target=bau.app_main, daemon=True).start(); time.sleep(3)
          ok = urllib.request.urlopen('http://127.0.0.1:7399/').status == 200
          open('smoke.txt', 'w').write('ok' if ok else 'fail')
          PY
          python smoke.py
          cat smoke.txt
          grep -q ok smoke.txt
          rm bau/style.css smoke.py smoke.txt

      - name: Build bau.exe
        run: >
          pyinstaller --onefile --noconsole --name bau
          --add-data "bau/app.html;."
          --add-data "assets/style.css;."
          bau/bau.py

      - name: Move the bau-latest tag to this commit
        shell: bash
        run: |
          git tag -f bau-latest
          git push -f origin bau-latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bau-latest
          name: Meu Baú (bau.exe)
          make_latest: true
          files: dist/bau.exe
          body: |
            App "Meu Baú" do PoE Builds: valor do baú do Path of Exile 1 em Chaos e Divine.
            Baixe o bau.exe, coloque numa pasta e dê dois cliques. Ele abre no seu navegador.
            Gerado automaticamente a partir do código em bau/bau.py (commit ${{ github.sha }}).
            Na primeira vez, o Windows pode avisar "O Windows protegeu o computador": clique em Mais informações > Executar assim mesmo.
